<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 días de mensajitos ♡</title>
<style>
:root{
  --night:#172c29;--pine:#23463b;--pine2:#315b49;--red:#9b3945;
  --red2:#b84d55;--cream:#fff4df;--gold:#d9b66f;--snow:#fffaf0;
  --ink:#493b32;--muted:#d8c8aa;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--snow);font-family:Georgia,serif;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(214,181,111,.16),transparent 45%),
    linear-gradient(145deg,#102522,#1b3931 55%,#102522);
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(#fff 1px,transparent 1.5px);
  background-size:42px 42px;
}
main{position:relative;max-width:1100px;margin:auto;padding:34px 20px 55px}
.hero{text-align:center;padding:22px 12px 30px}
.eyebrow{font:600 11px Arial,sans-serif;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.02;font-weight:400;color:var(--cream);margin:18px 0 12px;text-shadow:0 4px 18px #0005}
.subtitle{font-size:1.2rem;color:#ead8b8;font-style:italic}
.intro{color:#e7c77f;margin-top:22px;font-size:1rem}
.rule{width:110px;height:1px;background:var(--gold);margin:22px auto;position:relative}
.rule:before,.rule:after{content:"✦";position:absolute;top:-10px;color:var(--gold);font-size:14px}
.rule:before{left:-18px}.rule:after{right:-18px}
.progress{font:12px Arial,sans-serif;color:#d7c7a9;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}
.door{
  min-height:166px;position:relative;overflow:visible;cursor:pointer;
  border:2px solid var(--gold);border-radius:8px 8px 4px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:5px;padding:34px 8px 15px;margin-top:18px;
  color:var(--cream);background:linear-gradient(145deg,#a8424b,#762b38);
  box-shadow:0 7px 0 #10231f,0 11px 20px #0005;
  transition:transform .2s,filter .2s;isolation:isolate;
}
.door:nth-child(3n+2){background:linear-gradient(145deg,#35634d,#1d4438)}
.door:nth-child(3n){background:linear-gradient(145deg,#c49a55,#94703b)}
.door .house-roof{
  position:absolute;left:-7px;right:-7px;top:-22px;height:43px;
  background:linear-gradient(145deg,#b94b53,#7d2935);
  clip-path:polygon(50% 0,100% 100%,0 100%);
  filter:drop-shadow(0 3px 1px #10231f);z-index:2;pointer-events:none;
}
.door:nth-child(3n+2) .house-roof{background:linear-gradient(145deg,#47785a,#244936)}
.door:nth-child(3n) .house-roof{background:linear-gradient(145deg,#d4ad68,#96703a)}
.door .house-roof:after{
  content:"";position:absolute;left:10%;right:10%;bottom:2px;height:5px;
  background:repeating-linear-gradient(90deg,#fff0ce 0 8px,#b9444d 8px 16px);
}
.door .house-trim{
  position:absolute;inset:10px 9px 9px;border:1px solid rgba(255,239,199,.55);
  border-radius:3px;pointer-events:none;z-index:-1;
}
.door .wreath{
  position:absolute;top:48px;left:50%;transform:translateX(-50%);
  width:29px;height:29px;border:5px dotted #d9c879;border-radius:50%;
  color:#fff2d2;font-size:10px;display:grid;place-items:center;
  text-shadow:0 1px 3px #0008;
}
.door:after{
  content:"";position:absolute;top:15px;right:12px;width:7px;height:7px;
  border-radius:50%;background:#f6d98f;box-shadow:0 0 9px #ffe8a8;
}
.door:hover:not(:disabled){transform:translateY(-5px) scale(1.02);filter:brightness(1.12)}
.door:disabled{cursor:not-allowed;filter:grayscale(.5);opacity:.62}
.number{font-size:2.6rem;color:#fff5df;text-shadow:0 2px 4px #0005}
.door small{font:10px Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#fff0d0}
.door .ornament{font-size:19px;line-height:1}
.door.opened{outline:2px solid #f5dc9a;outline-offset:3px}
.footer{text-align:center;color:#e5cfaa;font-style:italic;margin-top:34px}
.overlay{position:fixed;inset:0;background:rgba(5,18,15,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.overlay.show{display:flex}
.modal{
  background:linear-gradient(145deg,#fff8e9,#f0e2c8);color:var(--ink);
  border:3px solid var(--gold);outline:1px solid #fff1c9;outline-offset:-9px;
  width:min(600px,100%);padding:42px 32px 30px;text-align:center;position:relative;
  box-shadow:0 20px 70px #0008;
}
.modal:before{content:"🎄";position:absolute;top:13px;left:18px;font-size:22px}
.modal:after{content:"✦";position:absolute;top:16px;right:20px;color:var(--red);font-size:22px}
.close{position:absolute;right:20px;bottom:15px;border:0;background:none;color:var(--red);font-size:1.6rem;cursor:pointer}
.modal .day{font:600 11px Arial,sans-serif;letter-spacing:.22em;color:var(--red)}
.modal h2{font-size:2.2rem;font-weight:400;color:#78313b;margin:20px 0}
.modal p{font-size:1.12rem;line-height:1.75;white-space:pre-line;margin-bottom:24px}
.back{border:0;border-radius:2px;background:var(--pine);color:white;padding:13px 20px;cursor:pointer;letter-spacing:.08em;font:11px Arial,sans-serif}
.hint{font:11px Arial,sans-serif;color:#8e7655;margin-top:20px}
.admin{display:block;margin:27px auto 0;border:1px solid var(--gold);background:#17352d;color:#ead8b8;padding:9px 14px;font:11px Arial,sans-serif;cursor:pointer}
.garland{font-size:25px;letter-spacing:8px;color:#d9b66f;margin:5px 0 12px}
@media(max-width:700px){
 main{padding:20px 13px 38px}.grid{grid-template-columns:repeat(4,1fr);gap:11px}
 .door{min-height:115px}.number{font-size:2.2rem}
}
@media(max-width:390px){.grid{grid-template-columns:repeat(3,1fr)}}
.surprise-image {
  display: none;
  width: 100%;
  max-width: 380px;
  max-height: 350px;
  object-fit: contain;
  margin: 20px auto;
  border: 4px solid #d9b66f;
  border-radius: 8px;
}

</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="garland" aria-hidden="true">✦ 🎄 ✦ 🎀 ✦</div>
    <div class="eyebrow">Hecho para mi princesa favorita</div>
    <h1>24 días de<br>magia contigo</h1>
    <div class="subtitle">Cada día tengo algo bonito para ti mi amor ♡</div>
    <div class="rule"></div>
    <div class="intro">Abre una puertita y descubre tu sorpresa</div>
  </header>
  <p class="progress" id="progress" style="text-align:center"></p>
  <section class="grid" id="calendar" aria-label="Calendario de Adviento"></section>
  <p class="footer">Con amor, para ti ♡</p>
  <button class="admin" id="adminButton" type="button">Modo edición / probar calendario</button>
</main>

<div class="overlay" id="overlay">
  <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <div class="day" id="dayLabel"></div>
    <h2 id="modalTitle"></h2>
    <p id="message"></p>
    <img id="surpriseImage" class="surprise-image" alt="Nuestro recuerdo">
    <button class="back" id="back" type="button">VOLVER A LAS 24 PUERTAS</button>
    <div class="hint">Un pequeño detalle para recordarte cuánto te amo ♡</div>
    <a id="songLink" target="_blank" rel="noopener"
   style="display:none;">
   🎵 Escuchar cancion
</a>
  </article>
</div>

<script>
// EDITA AQUÍ LOS TEXTOS DE CADA DÍA.
// Puedes poner enlaces a fotos o canciones dentro del mensaje si quieres.
const surprises = [
  ["Una bienvenida para ti","Amor, hoy comienza una pequeña aventura que preparé pensando en ti. Durante 24 días encontrarás una sorpresa, un recuerdo o unas palabras bonitas. Espero que cada día te saque una sonrisa. ¡Bienvenida a nuestro diciembre mi amoor! "],
  ["Cinco razones","Me encanta tu forma de ser, cómo me haces reír, la manera en que me escuchas, tu amor por mi y la felicidad que me haces sentir cuando me acompañas dia a dia"],
  ["Una foto especial","Hoy la sorpresa es una foto nuestra. Esta es una foto de una de las mejores cosas que hemos hecho y es haber ido a ese concierto mi amorcito , me encanto estar contigo ese día", "fotos/foto 1.jpeg" ],
  ["Un mensajito","Queria recordarte que te amo mucho, eres una de las mejores cosas que me ha pasado mi amor, cada vez que recuerdo como te conoci me emociono y se que no hemos estado bien pero me alegra que sigamos juntos dia a dia. 💗"],
  ["Un recuerdo nuestro","Mi amorcito te acuerdas cuando nos volvimos novios? JAJAJA fue un dia muy chevere y chistoso por como me lave y por como me recibiste en tu casa pero tambien fue muy bonito como hablamos ese dia y como nos abrazamos y nos dimos nuestros primeros piquitos de los mejores dia de mi vida."],
  ["Te dedico esta canción","Mi vidita hoy te voy a dedicar esta cancion que me recuerda mucho lo que te amo y el amor que te tengo. 🎶", null, "https://www.youtube.com/watch?v=q0FX4czufkI&list=RDq0FX4czufkI&start_radio=1"],
  ["Un deseo juntos","Ojalá sigamos juntos y si es posible que sea por toda la vida mi amor, porque me haces muy feliz, OJala seamos muy felices con nuestra familia y Ojala nunca se nos acaben las ganas de amarnos"],
  ["Lo que admiro de ti","Mi princesa admiro tu forma de salir adelante, tu personalidad y como te esfuerzas por dar lo mejor de ti cada dia."],
  ["Un plan juntos","Mi niñaa esto vale por una cita elegida entre los dos: puede ser dormir JAJAJAJA,ver una película o simplemente pasar tiempo juntos."],
  ["Una foto favorita","Mi niña esta es una foto muy especial para mi porque fue la primera vez que de verdad me senti feliz en mi cumpleaños y no sabes lo que te agradezco por tratar de hacerme sentir especial en mi cumpleaños. Te amooooooo muchooooo", "fotos/foto 2.jpeg"],
  ["Un día para ti","Hoy quiero que recuerdes que eres divina, que vales oro, que me encanta estar contigo, que me encanta como te esfuerzas por las cosas y que me haces muy feliz gracias por todo mi amor."],
  ["Mini pregunta","¿Cuál ha sido uno de tus momentos favoritos conmigo? Despues me lo cuentas mi amor 💌"],
  ["Gracias por estar","Gracias por estar siempre para mi amor y elegirme dia a dia a pesar de todos los problemas que hemos tenido"],
  ["Un cumplido","Tu forma de Ser es la mejor del mundo y eres esa personita que siempre quise tener a mi lado mi amor"],
  ["Un recuerdo divertido","Hoy toca recordar una de nuestras anécdotas más graciosas. Amoooor, te acuerdas de nuestro primer besooo JAJAJAJA me acuerdo que estaba todo nervioso pero ha sido de las mejores sensaciones que me has hecho descubrir te amoooooo JAJAJAJA."],
  ["Un deseo para ti","Deseo que tengas un gran futuro mi amor, que seas muy feliz y que logres tu sueño de ser arquitecta y tener una linda familia asi no sea conmigo."],
  ["Vale por una película","Mi amooor cupon válido para cualquier pelicula que quieras ver juntos, Puedes elejir la que tu quieraas, sea barbie, de miedo, de romance vale cualquieraa 🍿"],
  ["Lo que me haces sentir","Mi amoor, contigo me siento feliz, amado y elogiado me haces sentirme bonito elegido y adorado, gracias por seguir conmigo y hacerme tan feliz"],
  ["Una sorpresa musical","Te comparto otra canción para que sepas que te amo y que siempre voy a estar. 🎶", null, "https://www.youtube.com/watch?v=FBScYYaoeRc&list=RDFBScYYaoeRc&start_radio=1"],
  ["Tres recuerdos","Elige tres recuerdos nuestros que te gusten mucho. Yo también tengo los míos y quiero contártelos en persona cuando nos veamos mi amor."],
  ["Un abrazo pendiente","Te debo un abrazo largo de esos que hacen que todo se sienta un poquito mejor. Guarda este cupón para cobrarlo cuando nos veamos. Te amoooooooooooooooo"],
  ["Una carta pequeñita","Mi amor si pudiera guardar algo en mi corazoncito manualmente seria amarte para siempre y ser felices juntos"],
  ["Mañana es Navidad","Ya casi llega Navidad Mi amoooooooor, cuando te estoy haciendo esto no se si vamos a esta juntos pero ojala si y ojala podamos estar juntos toda la noche, gracias por seguir a mi lado todo este año, Te amoooooooooooo"],
  ["Mi regalo final","¡Feliz Navidad Mi amoooor! Gracias por seguir conmigo por valorarme y respetarme, gracias por acompañarme en cada momento y darme la felicidad que siempre quise tener te amo muchisimo mi niña y espero que disfrutes con tu familia y conmigo "]
];

// CONFIGURACIÓN:
// Antes del 1 de diciembre, las puertas permanecen cerradas.
// En diciembre se desbloquean según el día: del 1 al 24.
// Para probar, pulsa "Modo edición / probar calendario" y escribe la clave.
const CLAVE_EDICION = "Juan2008"; // CAMBIA ESTA CLAVE
let modoEdicion = false;
const hoy = new Date();
const esDiciembre = hoy.getMonth() === 11;
const diaActual = esDiciembre ? Math.min(hoy.getDate(), 24) : 0;

const calendar = document.getElementById("calendar");
const overlay = document.getElementById("overlay");
const progress = document.getElementById("progress");

function renderCalendar(){
  calendar.innerHTML = "";
  let disponibles = 0;

  // Se crean siempre 24 casitas, aunque falte personalizar algún mensaje.
  for(let index = 0; index < 24; index++){
    const item = surprises[index] || ["Sorpresa pendiente", "Edita este mensaje en la lista surprises."];
    const numero = index + 1;
    const desbloqueado = modoEdicion || numero <= diaActual;
    if(desbloqueado) disponibles++;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "door" + (desbloqueado ? "" : " locked");
    button.disabled = !desbloqueado;
    button.innerHTML = `
      <span class="house-roof" aria-hidden="true"></span>
      <span class="house-trim" aria-hidden="true"></span>
      <span class="wreath" aria-hidden="true">✦</span>
      <span class="number">${numero}</span>
      <small>${desbloqueado ? "Abrir" : "Cerrado"}</small>`;
    button.setAttribute("aria-label", `Día ${numero}${desbloqueado ? ", abrir sorpresa" : ", todavía cerrado"}`);

    button.addEventListener("click",()=>openDoor(index));
    calendar.appendChild(button);
  }

  progress.textContent = modoEdicion
    ? "Modo de edición activado: puedes probar las 24 sorpresas."
    : (diaActual === 0
        ? "Las 24 casitas están preparadas. Se abrirá una cada día desde el 1 de diciembre."
        : `${disponibles} de 24 sorpresas disponibles`);
}

function openDoor(index){
  if(!modoEdicion && index + 1 > diaActual) return;

  document.getElementById("dayLabel").textContent = `DÍA ${index+1}`;
  document.getElementById("modalTitle").textContent = surprises[index][0];
  document.getElementById("message").textContent = surprises[index][1];

  // Música: solo aparece si esta sorpresa tiene un enlace en la cuarta posición.
  const songLink = document.getElementById("songLink");
  const songUrl = surprises[index][3];
  if(songUrl){
    songLink.href = songUrl;
    songLink.style.display = "inline-block";
  }else{
    songLink.removeAttribute("href");
    songLink.style.display = "none";
  }

  // Foto: solo aparece si esta sorpresa tiene una ruta en la tercera posición.
  const photo = document.getElementById("surpriseImage");
  const photoPath = surprises[index][2];
  if(photoPath){
    photo.src = photoPath;
    photo.style.display = "block";
  }else{
    photo.removeAttribute("src");
    photo.style.display = "none";
  }

  overlay.classList.add("show");
}

function closeModal(){ overlay.classList.remove("show"); }
document.getElementById("close").addEventListener("click",closeModal);
document.getElementById("back").addEventListener("click",closeModal);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});

document.getElementById("adminButton").addEventListener("click",()=>{
  if(modoEdicion){
    modoEdicion = false;
    renderCalendar();
    return;
  }
  const clave = prompt("Introduce la clave de edición:");
  if(clave === CLAVE_EDICION){
    modoEdicion = true;
    renderCalendar();
    alert("¡Modo edición activado! Ya puedes abrir las 24 puertas.");
  }else if(clave !== null){
    alert("Clave incorrecta.");
  }
});

renderCalendar();
</script>
</body>
</html>
